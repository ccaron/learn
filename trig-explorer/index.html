<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sine Language: A Dad's Guide to the Unit Circle</title>
<style>
  html, body { height: 100%; margin: 0; }
  body { font-family: -apple-system, sans-serif; padding: 14px 20px 20px; box-sizing: border-box; background: #0f1420; color: #eee; overflow: hidden; display: flex; flex-direction: column; }
  .topnav { display: flex; align-items: center; gap: 18px; margin-bottom: 6px; font-size: 0.95em; flex: 0 0 auto; }
  .topnav a { color: #9ab; text-decoration: none; padding: 4px 2px; border-bottom: 2px solid transparent; }
  .topnav a:hover { color: #eee; }
  .topnav a.active { color: #eee; border-bottom-color: #6cf; }
  .topnav a.home { color: #78839c; margin-right: 10px; }
  .topnav .soon { color: #4d566e; }
  h1 { text-align: center; font-size: 1.5em; margin: 0 0 12px; flex: 0 0 auto; }
  .wrap { display: flex; gap: 16px; max-width: 1400px; width: 100%; margin: 0 auto; flex: 1 1 auto; min-height: 0; flex-wrap: nowrap; justify-content: center; align-items: stretch; }
  .panel { background: #1a2032; border-radius: 12px; padding: 16px; flex-shrink: 0; box-sizing: border-box; }
  .circle-panel { display: flex; flex-direction: column; align-items: stretch; justify-content: center; }
  .circle-panel canvas { flex: 0 0 auto; align-self: center; }
  .graph-panel { flex: 1 1 auto; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
  .row { margin-bottom: 16px; flex: 0 0 auto; }
  .subgroup { border: 1px solid #333; border-radius: 8px; padding: 12px; margin-bottom: 16px; }
  label { display: flex; justify-content: space-between; font-size: 1em; margin-bottom: 4px; }
  input[type=range] { width: 100%; }
  .val { color: #6cf; font-weight: bold; }
  .toggle-group { display: flex; gap: 8px; margin-bottom: 10px; flex: 0 0 auto; }
  button.toggle { flex: 1; padding: 8px; font-size: 1.05em; border-radius: 8px; border: 1px solid #444; background: #222a3f; color: #eee; cursor: pointer; }
  button.toggle.active { background: #3468c0; border-color: #6cf; }
  .fn-grid { display: flex; gap: 8px; margin-bottom: 10px; flex: 0 0 auto; }
  .fn-pair { flex: 1; display: flex; flex-direction: column; gap: 3px; border: 1px solid #2f3850; border-radius: 10px; padding: 4px; }
  .fn-pair .recip { text-align: center; font-size: 0.7em; color: #78839c; line-height: 1; }
  button.toggle small { display: block; font-size: 0.65em; color: #9ab; margin-top: 1px; }
  button.toggle.active small { color: #dde6ff; }
  button.mini { padding: 4px 12px; font-size: 0.95em; border-radius: 6px; border: 1px solid #444; background: #222a3f; color: #eee; cursor: pointer; }
  .challenge { display: none; align-items: center; justify-content: center; gap: 12px; margin-bottom: 10px; font-size: 1.1em; flex: 0 0 auto; }
  .layers { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.9em; flex: 0 0 auto; }
  button.chip { padding: 3px 10px; font-size: 1em; border-radius: 999px; border: 1px solid #3a4258; background: transparent; color: #78839c; cursor: pointer; }
  button.chip.active { background: #2b3a5c; border-color: #6cf; color: #eee; }
  canvas { background: #10151f; border-radius: 12px; touch-action: none; }
  #waveCanvas { flex: 1 1 0; min-height: 0; width: 100%; display: block; }
  .eq { text-align: center; font-size: 1.35em; margin-top: 10px; color: #9ecbff; flex: 0 0 auto; }
  .scrub { cursor: ew-resize; padding: 1px 3px; border-radius: 4px; touch-action: none; }
  .scrub:hover { background: rgba(255,255,255,0.12); }
  .scrub.scrubbing { background: rgba(255,255,255,0.22); }
  .legend { display: flex; justify-content: center; gap: 20px; margin-top: 10px; font-size: 1.05em; flex: 0 0 auto; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; }
  .swatch { display: inline-block; width: 18px; vertical-align: middle; margin-right: 6px; }
  .scrub-value { display: none; }
  .scrub:hover .scrub-letter, .scrub.scrubbing .scrub-letter { display: none; }
  .scrub:hover .scrub-value, .scrub.scrubbing .scrub-value { display: inline; }
</style>
</head>
<body>
<nav class="topnav">
  <a class="home" href="../">← All tools</a>
  <a href="../unit-circle/">Unit Circle</a>
  <a class="active" href="../trig-explorer/">Trig Graphs</a>
  <span class="soon">Modeling (soon)</span>
</nav>
<h1>Sine Language: A Dad's Guide to the Unit Circle</h1>
<div class="wrap">
  <div class="panel circle-panel">
    <div class="toggle-group">
      <button class="toggle" id="btnDeg">Degrees</button>
      <button class="toggle active" id="btnRad">Radians</button>
    </div>
    <!-- Each column pairs a function with its reciprocal. -->
    <div class="fn-grid">
      <div class="fn-pair">
        <button class="toggle active" id="btnFn_sin">sin</button>
        <span class="recip">↕ 1/x</span>
        <button class="toggle" id="btnFn_csc">csc<small>= 1/sin</small></button>
      </div>
      <div class="fn-pair">
        <button class="toggle" id="btnFn_cos">cos</button>
        <span class="recip">↕ 1/x</span>
        <button class="toggle" id="btnFn_sec">sec<small>= 1/cos</small></button>
      </div>
      <div class="fn-pair">
        <button class="toggle" id="btnFn_tan">tan<small>= sin/cos</small></button>
        <span class="recip">↕ 1/x</span>
        <button class="toggle" id="btnFn_cot">cot<small>= 1/tan</small></button>
      </div>
    </div>
    <button class="toggle" id="btnReset" style="width:100%; margin-bottom:10px; flex: 0 0 auto;">↺ Reset values</button>
    <button class="toggle" id="btnChallenge" style="width:100%; margin-bottom:10px; flex: 0 0 auto;">🎯 Challenge</button>
    <canvas id="circleCanvas" width="240" height="240"></canvas>
    <div id="fnBlurb" style="text-align:center; font-size:0.85em; color:#9ab; margin-top:10px; max-width:240px; align-self:center;"></div>
  </div>
  <div class="panel graph-panel">
    <div class="challenge" id="challengeBar">
      <span id="challengeMsg"></span>
      <button class="mini" id="btnNewChallenge">New</button>
      <button class="mini" id="btnReveal">Reveal</button>
    </div>
    <canvas id="waveCanvas" width="480" height="240"></canvas>
    <div class="legend">
      <div><span class="dot" id="legendDot" style="background:#ff6b6b"></span><span id="legendLabel">sin</span></div>
      <div style="opacity:0.6;"><span class="swatch" id="ghostSwatch" style="border-top:2px dashed #ff6b6b;"></span><span id="ghostLabel">sin(x) — starting point</span></div>
      <div id="partnerItem" style="display:none;"><span class="swatch" id="partnerSwatch" style="border-top:2px solid;"></span><span id="partnerLabel"></span></div>
      <div id="targetItem" style="display:none;"><span class="swatch" style="border-top:6px solid rgba(220,226,240,0.35);"></span>target</div>
    </div>
    <div class="layers" id="layerBar">
      <span style="color:#78839c;">Show:</span>
      <button class="chip" data-layer="ghost">starting curve</button>
      <button class="chip" data-layer="keyPoints">key points</button>
      <button class="chip" data-layer="maxMin">max / min</button>
      <button class="chip" data-layer="midline">midline</button>
      <button class="chip" data-layer="ref1">±1 lines</button>
      <button class="chip" data-layer="asymptotes">asymptotes</button>
      <button class="chip" data-layer="helper">helper curve</button>
    </div>
    <div class="eq" id="eqLine">y = 1.0 · sin(1.0·x + 0°) + 0.0</div>
    <div class="row" style="margin-top:12px; text-align:center;">
      <div>Angle x = <span class="val" id="angleVal">0</span> <span style="color:#78839c; font-size:0.85em;">(drag the amber line above)</span></div>
      <div>Period = <span class="val" id="periodVal"></span></div>
    </div>
  </div>
</div>
<div style="display:none;">
  <input type="range" id="angle" min="0" max="360" step="1" value="0">
  <input type="range" id="amp" min="-10" max="10" step="0.1" value="1">
  <input type="range" id="vshift" min="-20" max="20" step="0.1" value="0">
  <input type="range" id="bfreq" min="-20" max="20" step="0.1" value="1">
  <input type="range" id="phase" min="-1080" max="1080" step="1" value="0">
</div>

<script>
const $ = id => document.getElementById(id);
let useRadians = true;
let currentFn = 'sin';
// Optional graph layers, toggled from the "Show:" chips under the graph.
const layers = { ghost: true, keyPoints: true, maxMin: false, midline: true, ref1: false, asymptotes: true, helper: true };
let playing = false, playT = 0;

const FNS = ['sin', 'cos', 'tan', 'csc', 'sec', 'cot'];
const UNBOUNDED = new Set(['tan', 'csc', 'sec', 'cot']);
// tan and cot repeat every π instead of every 2π.
const PI_PERIOD = new Set(['tan', 'cot']);
// Reciprocals are graphed from their partner.
const PARTNER = { csc: 'sin', sec: 'cos', cot: 'tan' };
// Asymptotes sit where the inner angle equals offset + kπ.
const ASYMPTOTE_OFFSET = { tan: Math.PI/2, sec: Math.PI/2, csc: 0, cot: 0 };

// Reciprocal pairs share a color family: sin/csc warm, cos/sec cool, tan/cot green.
const FN_COLOR = { sin: '#ff6b6b', cos: '#c792ea', tan: '#8bd17c', csc: '#ffa94d', sec: '#7aa2ff', cot: '#c3e88d' };
const FN_BLURB = {
  sin: 'sin(x) is the height (y-coordinate) of the point on the circle at angle x.',
  cos: 'cos(x) is the horizontal position (x-coordinate) of the point on the circle at angle x.',
  tan: 'tan(x) = sin(x)/cos(x) — the slope of the line from the center through that point.',
  csc: 'csc(x) = 1/sin(x). Where sin is 0, csc blows up (asymptote). Where sin is ±1, csc is ±1 too.',
  sec: 'sec(x) = 1/cos(x). Where cos is 0, sec blows up (asymptote). Where cos is ±1, sec is ±1 too.',
  cot: 'cot(x) = 1/tan(x) = cos(x)/sin(x). Where sin is 0, cot blows up (asymptote); where tan blows up, cot is 0.',
};

// Inner angles of the parent function's key points (one cycle).
const KEY_INNERS = {
  sin: [0, Math.PI/2, Math.PI, 3*Math.PI/2, 2*Math.PI],
  cos: [0, Math.PI/2, Math.PI, 3*Math.PI/2, 2*Math.PI],
  tan: [-Math.PI/4, 0, Math.PI/4],
  csc: [Math.PI/2, 3*Math.PI/2],
  sec: [0, Math.PI],
  cot: [Math.PI/4, Math.PI/2, 3*Math.PI/4],
};

function withAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

const angleSlider = $('angle'), ampSlider = $('amp'), bSlider = $('bfreq'),
      phaseSlider = $('phase'), vshiftSlider = $('vshift');

function setToggle(btn, active) {
  btn.classList.toggle('active', active);
}

$('btnDeg').onclick = () => { useRadians = false; setToggle($('btnDeg'), true); setToggle($('btnRad'), false); updateAngleSliderRange(); updateCSliderRange(); draw(); };
$('btnRad').onclick = () => { useRadians = true; setToggle($('btnDeg'), false); setToggle($('btnRad'), true); updateAngleSliderRange(); updateCSliderRange(); draw(); };

function selectFn(name) {
  currentFn = name;
  FNS.forEach(f => setToggle($('btnFn_' + f), f === name));
  draw();
}
FNS.forEach(f => {
  $('btnFn_' + f).onclick = () => selectFn(f);
  $('btnFn_' + f).style.boxShadow = `inset 0 -3px 0 ${FN_COLOR[f]}`;
});

function resetParams() {
  ampSlider.value = 1;
  bSlider.value = 1;
  phaseSlider.value = 0;
  vshiftSlider.value = 0;
  angleSlider.value = 0;
}

$('btnReset').onclick = () => { resetParams(); draw(); };

const layerChips = document.querySelectorAll('#layerBar .chip');
layerChips.forEach(chip => {
  chip.onclick = () => { layers[chip.dataset.layer] = !layers[chip.dataset.layer]; draw(); };
});

// Sync chip state, and hide chips that don't apply to the current function.
function updateLayerBar() {
  const applies = {
    maxMin: !UNBOUNDED.has(currentFn),
    ref1: !PI_PERIOD.has(currentFn),
    asymptotes: UNBOUNDED.has(currentFn),
    helper: !!PARTNER[currentFn],
  };
  layerChips.forEach(chip => {
    const key = chip.dataset.layer;
    chip.classList.toggle('active', layers[key]);
    chip.style.display = applies[key] === false ? 'none' : '';
  });
}

// ---- Challenge: match a randomly generated target curve ----
let challenge = null;
let streak = 0;

function newChallenge() {
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  let t;
  do {
    t = {
      fn: currentFn,
      A: pick([0.5, 1, 1.5, 2, 2.5, 3]) * (Math.random() < 0.25 ? -1 : 1),
      B: pick([0.5, 1, 1, 2, 2, 3]),
      C: pick([-4, -3, -2, -1, 0, 1, 2, 3, 4]) * Math.PI / 4,
      D: pick([-2, -1.5, -1, -0.5, 0, 0, 0.5, 1, 1.5, 2]),
    };
  } while (t.A === 1 && t.B === 1 && t.C === 0 && t.D === 0);
  challenge = { ...t, revealed: false, counted: false };
  resetParams();
  draw();
}

$('btnChallenge').onclick = () => {
  if (challenge) challenge = null; else newChallenge();
  setToggle($('btnChallenge'), !!challenge);
  draw();
};
$('btnNewChallenge').onclick = newChallenge;
$('btnReveal').onclick = () => {
  if (!challenge) return;
  challenge.revealed = true;
  streak = 0;
  draw();
};

// Compare curves by sampling; atan keeps the asymptotes of tan/csc/sec finite.
// Equivalent forms (e.g. cos vs. a shifted sin) count as a match.
function curvesMatch(fnA, pa, fnB, pb) {
  const n = 400;
  let total = 0;
  for (let i = 0; i < n; i++) {
    const x = -2*Math.PI + (i + 0.37) * (4*Math.PI / n);
    const d = Math.abs(Math.atan(fn(fnA, x, pa.A, pa.B, pa.C, pa.D)) - Math.atan(fn(fnB, x, pb.A, pb.B, pb.C, pb.D)));
    if (!isNaN(d)) total += d;
  }
  return total / n < 1e-4;
}

function equationText(kind, A, B, C_rad, D) {
  const c = fmtAngleShort(useRadians ? C_rad : C_rad * 180 / Math.PI);
  return `y = ${fmtNum(A)} · ${kind}(${fmtNum(B)}(x − ${C_rad < 0 ? `(${c})` : c})) + ${fmtNum(D)}`;
}

function updateChallengeBar(matched) {
  $('challengeBar').style.display = challenge ? 'flex' : 'none';
  $('targetItem').style.display = challenge ? '' : 'none';
  if (!challenge) return;
  const streakText = streak > 0 ? ` 🔥 Streak: ${streak}` : '';
  let msg;
  if (matched) msg = `✅ Matched!${streakText}`;
  else if (challenge.revealed) msg = `Answer: ${equationText(challenge.fn, challenge.A, challenge.B, challenge.C, challenge.D)}`;
  else msg = `🎯 Drag A, B, C, D until your curve lands on the thick grey one.${streakText}`;
  $('challengeMsg').textContent = msg;
}

function scrubSpan(id, letter, value) {
  const cls = id === activeScrub ? 'scrub scrubbing' : 'scrub';
  return `<span class="${cls}" data-target="${id}"><span class="scrub-letter">${letter}</span><span class="scrub-value">${value}</span></span>`;
}

const SCRUB_CONFIG = {
  amp: { slider: ampSlider, pxPerStep: 6 },
  bfreq: { slider: bSlider, pxPerStep: 6 },
  phase: { slider: phaseSlider, pxPerStep: 3 },
  vshift: { slider: vshiftSlider, pxPerStep: 6 },
};

const eqEl = $('eqLine');
let scrubState = null;
let activeScrub = null;

eqEl.addEventListener('pointerdown', (e) => {
  const span = e.target.closest('.scrub');
  if (!span) return;
  const cfg = SCRUB_CONFIG[span.dataset.target];
  if (!cfg) return;
  scrubState = { cfg, startX: e.clientX, startVal: parseFloat(cfg.slider.value) };
  activeScrub = span.dataset.target;
  eqEl.setPointerCapture(e.pointerId);
  e.preventDefault();
  draw();
});

eqEl.addEventListener('pointermove', (e) => {
  if (!scrubState) return;
  const { cfg, startX, startVal } = scrubState;
  const step = parseFloat(cfg.slider.step);
  const min = parseFloat(cfg.slider.min), max = parseFloat(cfg.slider.max);
  const dx = e.clientX - startX;
  let newVal = startVal + Math.round(dx / cfg.pxPerStep) * step;
  newVal = Math.min(max, Math.max(min, newVal));
  cfg.slider.value = newVal;
  draw();
});

function endScrub() {
  if (!scrubState) return;
  scrubState = null;
  activeScrub = null;
  draw();
}
eqEl.addEventListener('pointerup', endScrub);
eqEl.addEventListener('pointercancel', endScrub);

function updateAngleSliderRange() {
  if (useRadians) {
    angleSlider.min = -24; angleSlider.max = 24; angleSlider.step = 1;
    angleSlider.value = 0;
  } else {
    angleSlider.min = -360; angleSlider.max = 360; angleSlider.step = 1;
    angleSlider.value = 0;
  }
}

function updateCSliderRange() {
  if (useRadians) {
    phaseSlider.min = -72; phaseSlider.max = 72; phaseSlider.step = 1;
  } else {
    phaseSlider.min = -1080; phaseSlider.max = 1080; phaseSlider.step = 1;
  }
  phaseSlider.value = 0;
}

function angleFromSlider() {
  const v = parseFloat(angleSlider.value);
  return useRadians ? v * Math.PI / 12 : v;
}

function cFromSlider() {
  const v = parseFloat(phaseSlider.value);
  return useRadians ? v * Math.PI / 12 : v;
}

const waveCanvasEl = $('waveCanvas');
let draggingAngle = false;

function setAngleFromEvent(e) {
  const rect = waveCanvasEl.getBoundingClientRect();
  const offsetX = e.clientX - rect.left;
  const w = rect.width;
  const domHalf = useRadians ? 2*Math.PI : 360;
  let x = -domHalf + ((offsetX - 30) / (w - 40)) * (2*domHalf);
  x = Math.max(-domHalf, Math.min(domHalf, x));
  const sliderVal = useRadians ? Math.round(x / (Math.PI/12)) : Math.round(x);
  const min = parseFloat(angleSlider.min), max = parseFloat(angleSlider.max);
  angleSlider.value = Math.max(min, Math.min(max, sliderVal));
  draw();
}

waveCanvasEl.style.cursor = 'ew-resize';
waveCanvasEl.addEventListener('pointerdown', (e) => {
  draggingAngle = true;
  waveCanvasEl.setPointerCapture(e.pointerId);
  setAngleFromEvent(e);
});
waveCanvasEl.addEventListener('pointermove', (e) => {
  if (draggingAngle) setAngleFromEvent(e);
});
waveCanvasEl.addEventListener('pointerup', () => { draggingAngle = false; });
waveCanvasEl.addEventListener('pointercancel', () => { draggingAngle = false; });

function fracPiLabelUnwrapped(twelfths) {
  if (twelfths === 0) return '0';
  const sign = twelfths < 0 ? '-' : '';
  const t = Math.abs(twelfths);
  const g = gcd(t, 12);
  const num = t / g, den = 12 / g;
  const numStr = num === 1 ? '' : num;
  return sign + (den === 1 ? `${numStr}π` : `${numStr}π/${den}`);
}

function gcd(a, b) { return b === 0 ? a : gcd(b, a % b); }

[angleSlider, ampSlider, bSlider, phaseSlider, vshiftSlider].forEach(s => s.addEventListener('input', draw));


function draw() {
  const A = parseFloat(ampSlider.value);
  const B = parseFloat(bSlider.value);
  const C_domain = cFromSlider();
  const C_rad = useRadians ? C_domain : C_domain * Math.PI / 180;
  const D = parseFloat(vshiftSlider.value);
  const theta = angleFromSlider();
  const thetaRad = useRadians ? theta : theta * Math.PI / 180;

  $('angleVal').textContent = useRadians
    ? fracPiLabelUnwrapped(Math.round(parseFloat(angleSlider.value))) + ' rad'
    : parseFloat(angleSlider.value).toFixed(0) + '°';

  const baseCycle = PI_PERIOD.has(currentFn) ? Math.PI : 2*Math.PI;
  const period = useRadians ? (baseCycle / Math.abs(B)) : (baseCycle * 180/Math.PI / Math.abs(B));
  if (B === 0) {
    $('periodVal').textContent = '∞';
  } else if (useRadians) {
    const twelfths = period / (Math.PI/12);
    const rounded = Math.round(twelfths);
    $('periodVal').textContent = Math.abs(twelfths - rounded) < 0.03
      ? fracPiLabelUnwrapped(rounded) + ' rad'
      : period.toFixed(2) + ' rad';
  } else {
    $('periodVal').textContent = period.toFixed(2) + '°';
  }

  $('eqLine').innerHTML =
    `y = ${scrubSpan('amp', 'A', A.toFixed(1))} · ${currentFn}(${scrubSpan('bfreq', 'B', B.toFixed(1))}(x - ${scrubSpan('phase', 'C', C_domain < 0 ? `(${formatDomainValue(C_domain)})` : formatDomainValue(C_domain))})) + ${scrubSpan('vshift', 'D', D.toFixed(1))}`;
  $('eqLine').style.color = FN_COLOR[currentFn];
  $('legendDot').style.background = FN_COLOR[currentFn];
  $('legendLabel').textContent = currentFn;
  $('ghostSwatch').style.borderTopColor = FN_COLOR[currentFn];
  $('ghostLabel').textContent = `${currentFn}(x) — starting point`;
  $('ghostSwatch').parentElement.style.display = layers.ghost ? '' : 'none';
  const partner = PARTNER[currentFn];
  $('partnerItem').style.display = partner && layers.helper ? '' : 'none';
  if (partner) {
    $('partnerSwatch').style.borderTopColor = withAlpha(FN_COLOR[partner], 0.6);
    $('partnerLabel').textContent = `${partner} helper (${currentFn} = 1/${partner})`;
  }
  $('fnBlurb').textContent = FN_BLURB[currentFn];

  let matched = false;
  if (challenge) {
    matched = curvesMatch(currentFn, { A, B, C: C_rad, D }, challenge.fn, challenge);
    if (matched && !challenge.counted) {
      challenge.counted = true;
      if (!challenge.revealed) streak++;
    }
  }
  updateChallengeBar(matched);
  updateLayerBar();

  drawCircle(B * (thetaRad - C_rad));
  drawWave(A, B, C_domain, D, theta);
}

function baseValue(kind, u) {
  switch (kind) {
    case 'sin': return Math.sin(u);
    case 'cos': return Math.cos(u);
    case 'tan': return Math.tan(u);
    case 'csc': return 1 / Math.sin(u);
    case 'sec': return 1 / Math.cos(u);
    case 'cot': return Math.cos(u) / Math.sin(u);
  }
}

function fn(kind, x, A, B, C, D) {
  return A * baseValue(kind, B * (x - C)) + D;
}

function setupCanvas(canvas, cssW, cssH) {
  const dpr = window.devicePixelRatio || 1;
  const physW = Math.round(cssW * dpr), physH = Math.round(cssH * dpr);
  if (canvas.width !== physW) canvas.width = physW;
  if (canvas.height !== physH) canvas.height = physH;
  canvas.style.width = cssW + 'px';
  canvas.style.height = cssH + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return ctx;
}

function drawArrowHead(ctx, x, y, angle, len) {
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - len*Math.cos(angle - Math.PI/6), y - len*Math.sin(angle - Math.PI/6));
  ctx.lineTo(x - len*Math.cos(angle + Math.PI/6), y - len*Math.sin(angle + Math.PI/6));
  ctx.closePath();
  ctx.fill();
}

function drawSpanArrow(ctx, x1, y1, x2, y2, color, lineWidth) {
  const dist = Math.hypot(x2 - x1, y2 - y1);
  if (dist < 1) return;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lineWidth;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  const angle = Math.atan2(y2 - y1, x2 - x1);
  const head = Math.min(8, dist / 3);
  drawArrowHead(ctx, x2, y2, angle, head);
  drawArrowHead(ctx, x1, y1, angle + Math.PI, head);
}

// One-headed arrow that stops `gap` px short of both ends (so it doesn't cover the dots).
function drawArrow(ctx, x1, y1, x2, y2, color, lineWidth, gap) {
  const dist = Math.hypot(x2 - x1, y2 - y1);
  if (dist < 2*gap + 4) return;
  const ux = (x2 - x1) / dist, uy = (y2 - y1) / dist;
  const sx = x1 + ux*gap, sy = y1 + uy*gap, ex = x2 - ux*gap, ey = y2 - uy*gap;
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = lineWidth;
  ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
  drawArrowHead(ctx, ex, ey, Math.atan2(uy, ux), Math.min(9, dist / 3));
}

function drawCircle(theta) {
  const c = $('circleCanvas');
  const w = 240, h = 240;
  const ctx = setupCanvas(c, w, h);
  ctx.clearRect(0, 0, w, h);
  // Smaller circle for tan/csc/sec/cot so the segments that reach past ±1 stay visible.
  const cx = w/2, cy = h/2, r = UNBOUNDED.has(currentFn) ? 55 : 100;

  ctx.lineWidth = 1.5;
  ctx.strokeStyle = withAlpha(FN_COLOR.cos, 0.4);
  ctx.beginPath(); ctx.moveTo(0, cy); ctx.lineTo(w, cy); ctx.stroke();
  ctx.strokeStyle = withAlpha(FN_COLOR.sin, 0.4);
  ctx.beginPath(); ctx.moveTo(cx, 0); ctx.lineTo(cx, h); ctx.stroke();

  ctx.font = '11px -apple-system, sans-serif';
  ctx.fillStyle = FN_COLOR.cos; ctx.fillText('cos (x)', w - 44, cy - 6);
  ctx.fillStyle = FN_COLOR.sin; ctx.fillText('sin (y)', cx + 6, 12);

  ctx.strokeStyle = '#556'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 2*Math.PI); ctx.stroke();

  const px = cx + r * Math.cos(theta);
  const py = cy - r * Math.sin(theta);

  ctx.strokeStyle = '#888'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, py); ctx.stroke();

  ctx.strokeStyle = FN_COLOR[currentFn]; ctx.lineWidth = 3;
  if (currentFn === 'cos') {
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(px, cy); ctx.stroke();
  } else if (currentFn === 'sin') {
    ctx.beginPath(); ctx.moveTo(px, cy); ctx.lineTo(px, py); ctx.stroke();
  } else if (currentFn === 'tan') {
    const t = Math.tan(theta);
    const clamped = Math.max(-3, Math.min(3, t));
    const tx = cx + r, ty = cy - clamped * r;
    ctx.beginPath(); ctx.moveTo(cx + r, cy - 3*r); ctx.lineTo(cx + r, cy + 3*r); ctx.stroke();
    ctx.strokeStyle = FN_COLOR[currentFn]; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tx, ty); ctx.stroke();
  } else if (currentFn === 'cot') {
    // cot: extend the radius until it hits the horizontal line y = 1; that x is cot.
    const v = Math.max(-3, Math.min(3, baseValue('cot', theta)));
    const tx = cx + v * r, ty = cy - r;
    ctx.strokeStyle = withAlpha(FN_COLOR.cot, 0.5); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(cx - 3*r, ty); ctx.lineTo(cx + 3*r, ty); ctx.stroke();
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.setLineDash([]);
    ctx.strokeStyle = FN_COLOR.cot; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, ty); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.fillStyle = FN_COLOR.cot;
    ctx.beginPath(); ctx.arc(tx, ty, 4, 0, 2*Math.PI); ctx.fill();
  } else {
    // csc/sec: the tangent line at the point crosses the y-axis at csc and the x-axis at sec.
    const tdx = -Math.sin(theta), tdy = -Math.cos(theta); // tangent direction, screen coords
    ctx.strokeStyle = withAlpha(FN_COLOR[currentFn], 0.5); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(px - 6*r*tdx, py - 6*r*tdy); ctx.lineTo(px + 6*r*tdx, py + 6*r*tdy); ctx.stroke();

    const partner = PARTNER[currentFn];
    ctx.strokeStyle = withAlpha(FN_COLOR[partner], 0.7); ctx.lineWidth = 2;
    ctx.beginPath();
    if (currentFn === 'csc') { ctx.moveTo(px, cy); ctx.lineTo(px, py); }
    else { ctx.moveTo(cx, cy); ctx.lineTo(px, cy); }
    ctx.stroke();

    const v = Math.max(-4, Math.min(4, baseValue(currentFn, theta)));
    const ex = currentFn === 'sec' ? cx + v*r : cx, ey = currentFn === 'csc' ? cy - v*r : cy;
    ctx.strokeStyle = FN_COLOR[currentFn]; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.fillStyle = FN_COLOR[currentFn];
    ctx.beginPath(); ctx.arc(ex, ey, 4, 0, 2*Math.PI); ctx.fill();
  }

  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(px, py, 5, 0, 2*Math.PI); ctx.fill();

  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(cx, cy, 25, 0, -theta, theta > 0);
  ctx.stroke();

  const s = Math.sin(theta), co = Math.cos(theta);
  const f2 = v => (!isFinite(v) || Math.abs(v) > 1e6) ? 'undefined' : (+v.toFixed(2) || 0).toFixed(2);
  const readout = {
    sin: `sin = ${f2(s)}`,
    cos: `cos = ${f2(co)}`,
    tan: `tan = ${f2(s)} / ${f2(co)} = ${f2(s / co)}`,
    csc: `csc = 1 / ${f2(s)} = ${f2(1 / s)}`,
    sec: `sec = 1 / ${f2(co)} = ${f2(1 / co)}`,
    cot: `cot = ${f2(co)} / ${f2(s)} = ${f2(co / s)}`,
  }[currentFn];
  ctx.font = '12px -apple-system, sans-serif';
  ctx.fillStyle = FN_COLOR[currentFn];
  ctx.fillText(readout, 8, h - 8);
}

let yRange = null;

// Smallest of 1, 1.5, 2, 3, 5 (× 10^k) that is ≥ v.
function niceCeil(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 1.5, 2, 3, 5, 10]) if (m * p >= v - 1e-9) return m * p;
}

// Smallest of 1, 2, 5 (× 10^k) that is ≥ v.
function niceStep(v) {
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1, 2, 5, 10]) if (m * p >= v - 1e-9) return m * p;
}

// y-range that fits the curve and always shows the x-axis and the parent's ±1.
function yRangeTarget(kind, A, D) {
  const reach = UNBOUNDED.has(kind) ? 2.5 * Math.max(Math.abs(A), 0.4) : Math.abs(A);
  const top = Math.max(D + reach, 1), bottom = Math.min(D - reach, -1);
  return { hi: niceCeil(top * 1.15), lo: -niceCeil(-bottom * 1.15) };
}

function drawWave(A, B, C_domain, D, currentTheta) {
  const c = $('waveCanvas');
  const rect = c.getBoundingClientRect();
  const w = Math.max(300, rect.width);
  const h = Math.max(150, rect.height);
  const ctx = setupCanvas(c, w, h);
  ctx.clearRect(0, 0, w, h);
  const C_rad = useRadians ? C_domain : C_domain * Math.PI / 180;
  // Fit the y-range to the curve (and the challenge target). While scrubbing, only
  // grow it, so changing A or D visibly changes the curve instead of the axis.
  let target = yRangeTarget(currentFn, A, D);
  if (challenge) {
    const t = yRangeTarget(challenge.fn, challenge.A, challenge.D);
    target = { lo: Math.min(target.lo, t.lo), hi: Math.max(target.hi, t.hi) };
  }
  yRange = (activeScrub && yRange)
    ? { lo: Math.min(yRange.lo, target.lo), hi: Math.max(yRange.hi, target.hi) }
    : target;
  const scaleY = (h - 40) / (yRange.hi - yRange.lo);
  const midY = 20 + yRange.hi * scaleY; // pixel row of y = 0
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const fs = clamp(h/220, 0.9, 1.7);
  const labelFont = `${Math.round(13*fs)}px -apple-system, sans-serif`;
  const tickFont = `${Math.round(12*fs)}px -apple-system, sans-serif`;

  const domHalf = useRadians ? 2*Math.PI : 360;
  const domXMin = -domHalf, domXMax = domHalf;
  const xToPixel = x => 30 + ((x - domXMin) / (domXMax - domXMin)) * (w - 40);
  const radToPixel = xr => xToPixel(useRadians ? xr : xr * 180 / Math.PI);

  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(0, midY); ctx.lineTo(w, midY); ctx.stroke();
  ctx.strokeStyle = withAlpha(FN_COLOR[currentFn], 0.4); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(xToPixel(0), 0); ctx.lineTo(xToPixel(0), h); ctx.stroke();

  ctx.font = labelFont;
  ctx.fillStyle = '#ffd166'; ctx.fillText('x (angle) →', w - 14*fs*7, midY - 8*fs);
  ctx.fillStyle = FN_COLOR[currentFn]; ctx.fillText(`${currentFn}(x) ↑`, xToPixel(0) + 8, 16*fs);

  const yStep = niceStep((yRange.hi - yRange.lo) / 8);
  ctx.strokeStyle = '#2a3348'; ctx.setLineDash([2,4]); ctx.lineWidth = 1;
  ctx.font = tickFont; ctx.fillStyle = '#78839c';
  for (let v = Math.ceil(yRange.lo / yStep) * yStep; v <= yRange.hi + 1e-9; v += yStep) {
    if (Math.abs(v) < 1e-9) continue;
    if (!PI_PERIOD.has(currentFn) && Math.abs(Math.abs(v) - 1) < 1e-9) continue; // drawn as ±1 reference below
    const y = midY - v * scaleY;
    ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(w, y); ctx.stroke();
    ctx.fillText(v.toFixed(yStep < 1 ? 1 : 0), 34, y - 3);
  }
  ctx.setLineDash([]);

  if (layers.ref1 && !PI_PERIOD.has(currentFn)) {
    const oneY = midY - 1*scaleY, negOneY = midY + 1*scaleY;
    ctx.strokeStyle = '#3a4258'; ctx.setLineDash([2,4]); ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(30, oneY); ctx.lineTo(w, oneY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, negOneY); ctx.lineTo(w, negOneY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#5c6787'; ctx.font = labelFont;
    ctx.fillText('1.0', 34, oneY - 3);
    ctx.fillText('-1.0', 34, negOneY + 14*fs);
  }

  if (layers.maxMin && !UNBOUNDED.has(currentFn)) {
    const maxVal = D + Math.abs(A), minVal = D - Math.abs(A);
    const maxY = midY - maxVal * scaleY, minY = midY - minVal * scaleY;
    ctx.strokeStyle = '#9ab'; ctx.setLineDash([3,3]);
    ctx.beginPath(); ctx.moveTo(30, maxY); ctx.lineTo(w, maxY); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(30, minY); ctx.lineTo(w, minY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#9ab'; ctx.font = labelFont;
    ctx.fillText(`max = ${maxVal.toFixed(1)}`, 100, maxY - 4);
    ctx.fillText(`min = ${minVal.toFixed(1)}`, 100, minY + 16*fs);
  }

  if (layers.midline && D !== 0) {
    const midLineY = midY - D * scaleY;
    ctx.strokeStyle = '#eaeaea'; ctx.setLineDash([8,3]); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(30, midLineY); ctx.lineTo(w, midLineY); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#eaeaea'; ctx.font = labelFont;
    ctx.textAlign = 'right';
    ctx.fillText(`midline (D = ${D.toFixed(1)})`, w - 10, midLineY - 6);
    ctx.textAlign = 'left';
  }

  const tickStep = useRadians ? Math.PI/2 : 90;
  ctx.strokeStyle = '#2a3348'; ctx.fillStyle = '#78839c';
  ctx.font = tickFont; ctx.textAlign = 'center';
  for (let t = domXMin; t <= domXMax + 1e-6; t += tickStep) {
    const tx = xToPixel(t);
    ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(tx, 0); ctx.lineTo(tx, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(tx, midY - 4); ctx.lineTo(tx, midY + 4); ctx.stroke();
    const label = useRadians ? fracPiLabelUnwrapped(Math.round(t / (Math.PI/12))) : `${Math.round(t)}°`;
    ctx.fillText(label, tx, midY + 16);
  }
  ctx.textAlign = 'left';

  // Vertical asymptotes for tan/csc/sec.
  const off = ASYMPTOTE_OFFSET[currentFn];
  if (layers.asymptotes && off !== undefined && B !== 0) {
    const u1 = B * (-2*Math.PI - C_rad), u2 = B * (2*Math.PI - C_rad);
    const kMin = Math.ceil((Math.min(u1, u2) - off) / Math.PI);
    const kMax = Math.floor((Math.max(u1, u2) - off) / Math.PI);
    ctx.strokeStyle = withAlpha(FN_COLOR[currentFn], 0.45); ctx.setLineDash([4,6]); ctx.lineWidth = 1;
    for (let k = kMin; k <= kMax && k - kMin < 200; k++) {
      const ax = radToPixel((off + k*Math.PI) / B + C_rad);
      ctx.beginPath(); ctx.moveTo(ax, 0); ctx.lineTo(ax, h); ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  function plot(kind, color, lineWidth, pA, pB, pC, pD) {
    ctx.strokeStyle = color; ctx.lineWidth = lineWidth;
    const asymOff = ASYMPTOTE_OFFSET[kind];
    let prevBranch = null;
    ctx.beginPath();
    for (let px = 30; px <= w; px++) {
      const x = domXMin + ((px - 30) / (w - 40)) * (domXMax - domXMin);
      const xr = useRadians ? x : x * Math.PI / 180;
      const py = clamp(midY - fn(kind, xr, pA, pB, pC, pD) * scaleY, -2*h, 3*h);
      // Lift the pen when crossing an asymptote so branches don't get joined.
      const branch = asymOff === undefined ? 0 : Math.floor((pB * (xr - pC) - asymOff) / Math.PI);
      if (branch !== prevBranch) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
      prevBranch = branch;
    }
    ctx.stroke();
  }

  if (challenge) {
    plot(challenge.fn, 'rgba(220,226,240,0.28)', 7, challenge.A, challenge.B, challenge.C, challenge.D);
  }

  // Ghost of the parent function (A=1, B=1, C=0, D=0) as a reference point.
  if (layers.ghost) {
    ctx.setLineDash([6,5]);
    plot(currentFn, withAlpha(FN_COLOR[currentFn], 0.35), 2, 1, 1, 0, 0);
    ctx.setLineDash([]);
  }

  // csc/sec are graphed from their partner: A·sin(...)+D or A·cos(...)+D.
  const partner = PARTNER[currentFn];
  if (partner && layers.helper) plot(partner, withAlpha(FN_COLOR[partner], 0.6), 1.5, A, B, C_rad, D);

  plot(currentFn, FN_COLOR[currentFn], 2.5, A, B, C_rad, D);

  const curX = xToPixel(currentTheta);
  ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 1;
  ctx.setLineDash([4,4]);
  ctx.beginPath(); ctx.moveTo(curX, 0); ctx.lineTo(curX, h); ctx.stroke();
  ctx.setLineDash([]);

  const currentThetaRad = useRadians ? currentTheta : currentTheta * Math.PI / 180;
  const yVal = fn(currentFn, currentThetaRad, A, B, C_rad, D);
  const yPx = midY - yVal * scaleY;
  if (yPx > -20 && yPx < h + 20) {
    ctx.fillStyle = FN_COLOR[currentFn]; ctx.beginPath(); ctx.arc(curX, yPx, 5, 0, 2*Math.PI); ctx.fill();
  }

  if (layers.keyPoints) drawKeyPoints(ctx, A, B, C_rad, D, radToPixel, midY, scaleY, tickFont);

  if (activeScrub) drawAnnotation(ctx, activeScrub, A, B, C_domain, D, w, h, midY, scaleY, domXMax, xToPixel, labelFont);
}

// Key points of one parent cycle, with arrows showing where A, B, C, D move each one.
function drawKeyPoints(ctx, A, B, C_rad, D, radToPixel, midY, scaleY, font) {
  if (B === 0) return;
  const color = FN_COLOR[currentFn];
  ctx.font = font;
  ctx.textAlign = 'center';
  for (const inner of KEY_INNERS[currentFn]) {
    const base = baseValue(currentFn, inner);
    const x0 = radToPixel(inner), y0 = midY - base * scaleY;
    const xnRad = inner / B + C_rad, yn = A * base + D;
    const x1 = radToPixel(xnRad), y1 = midY - yn * scaleY;

    drawArrow(ctx, x0, y0, x1, y1, 'rgba(255,255,255,0.45)', 1.5, 7);

    ctx.strokeStyle = withAlpha(color, 0.7); ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x0, y0, 4, 0, 2*Math.PI); ctx.stroke();

    ctx.fillStyle = color; ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(x1, y1, 5, 0, 2*Math.PI); ctx.fill(); ctx.stroke();

    const label = `(${fmtAngleShort(useRadians ? xnRad : xnRad * 180 / Math.PI)}, ${fmtNum(yn)})`;
    const ly = yn >= D ? y1 - 12 : y1 + 22;
    const tw = ctx.measureText(label).width;
    ctx.fillStyle = 'rgba(16,21,31,0.8)';
    ctx.fillRect(x1 - tw/2 - 3, ly - 13, tw + 6, 17);
    ctx.fillStyle = '#fff';
    ctx.fillText(label, x1, ly);
  }
  ctx.textAlign = 'left';
}

function drawAnnotation(ctx, kind, A, B, C_domain, D, w, h, midY, scaleY, domXMax, xToPixel, labelFont) {
  const HILITE = '#fff8e1';
  ctx.font = labelFont;
  ctx.textAlign = 'left';

  if (kind === 'amp' || kind === 'vshift') {
    if (PI_PERIOD.has(currentFn)) return;
    let ax;
    if (B === 0) {
      ax = xToPixel(domXMax * 0.15);
    } else {
      // Where the base function equals 1: sin/csc at π/2, cos/sec at 0.
      const target = (currentFn === 'sin' || currentFn === 'csc') ? Math.PI/2 : 0;
      const C_rad = useRadians ? C_domain : C_domain * Math.PI / 180;
      let thetaPeak = target / B + C_rad;
      const per = 2*Math.PI / Math.abs(B);
      thetaPeak = ((thetaPeak % per) + per) % per;
      const domainPeak = useRadians ? thetaPeak : thetaPeak * 180/Math.PI;
      ax = xToPixel(domainPeak);
    }
    if (kind === 'amp') {
      const y1 = midY - D * scaleY, y2 = midY - (D + A) * scaleY;
      drawSpanArrow(ctx, ax, y1, ax, y2, HILITE, 2.5);
      ctx.fillStyle = HILITE;
      const what = UNBOUNDED.has(currentFn) ? 'vertical stretch' : 'amplitude';
      ctx.fillText(`A = ${A.toFixed(1)} (${what})`, ax + 8, (y1 + y2) / 2);
    } else {
      const bx = w - 20;
      drawSpanArrow(ctx, bx, midY, bx, midY - D * scaleY, HILITE, 2.5);
      ctx.fillStyle = HILITE;
      ctx.textAlign = 'right';
      ctx.fillText(`D = ${D.toFixed(1)} (vertical shift)`, bx - 8, midY - D * scaleY / 2);
      ctx.textAlign = 'left';
    }
  } else if (kind === 'bfreq') {
    if (B === 0) return;
    const baseCycle = PI_PERIOD.has(currentFn) ? Math.PI : 2*Math.PI;
    const periodDomain = useRadians ? (baseCycle / Math.abs(B)) : (baseCycle * 180/Math.PI / Math.abs(B));
    // A cycle starts at x = C; shift by whole periods so it lands near the origin.
    const cycleStart = C_domain - periodDomain * Math.floor(C_domain / periodDomain);
    let x1, x2;
    if (currentFn === 'tan') {
      x1 = xToPixel(cycleStart - periodDomain / 2);
      x2 = xToPixel(cycleStart + periodDomain / 2);
    } else {
      x1 = xToPixel(cycleStart);
      x2 = xToPixel(cycleStart + periodDomain);
    }
    const y = 30;
    drawSpanArrow(ctx, x1, y, x2, y, HILITE, 2.5);
    ctx.fillStyle = HILITE;
    ctx.textAlign = 'center';
    ctx.fillText(`period = ${formatDomainValue(periodDomain)}`, (x1 + x2) / 2, y - 8);
    ctx.textAlign = 'left';
  } else if (kind === 'phase') {
    const x1 = xToPixel(0), x2 = xToPixel(C_domain);
    const y = midY + 24;
    drawSpanArrow(ctx, x1, y, x2, y, HILITE, 2.5);
    ctx.fillStyle = HILITE;
    ctx.textAlign = 'center';
    ctx.fillText(`C = ${formatDomainValue(C_domain)} (horizontal shift)`, (x1 + x2) / 2, y + 16);
    ctx.textAlign = 'left';
  }
}

function formatDomainValue(v) {
  if (!useRadians) return v.toFixed(1) + '°';
  const twelfths = v / (Math.PI/12);
  const rounded = Math.round(twelfths);
  if (Math.abs(twelfths - rounded) < 0.03) return fracPiLabelUnwrapped(rounded) + ' rad';
  return v.toFixed(2) + ' rad';
}

// Compact angle for point labels: "π/4", "1.23", "45°".
function fmtAngleShort(v) {
  if (!useRadians) return fmtNum(v) + '°';
  const twelfths = v / (Math.PI/12);
  const rounded = Math.round(twelfths);
  if (Math.abs(twelfths - rounded) < 0.03) return fracPiLabelUnwrapped(rounded);
  return fmtNum(v);
}

// Up to 2 decimals, trailing zeros dropped, no "-0".
function fmtNum(v) {
  return String(+v.toFixed(2) || 0);
}

updateAngleSliderRange();
updateCSliderRange();
draw();
window.addEventListener('resize', draw);
</script>
</body>
